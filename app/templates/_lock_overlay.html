<div id="lockOverlay" class="lock-veil">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Phiên đã khóa</div>
    <div id="lockMsg" class="lock-sub">Không phát hiện hoạt động — phiên được khóa để bảo vệ. Nhập mật khẩu để mở khóa.</div>
    <input id="lockPass" type="password" placeholder="Mật khẩu" class="lock-input" autocomplete="current-password" onkeydown="if(event.key==='Enter')lockVerify()">
    <div id="lockErr" class="lock-err"></div>
    <button id="lockBtnVerify" class="lock-btn" onclick="lockVerify()">Mở khóa</button>
  </div>
</div>
