<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#090a09">
<title>Chi tiết trận đấu — Football Ops</title>
<link rel="stylesheet" href="/static/fonts.css?v=44" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/static/fonts.css?v=44"></noscript>
<link rel="stylesheet" href="/static/theme.css?v=44">
<style>
/* ---- match snapshot hero ---- */
.snap{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--card2) 0%,var(--surface) 100%);
  border:1px solid var(--line2);border-radius:16px;padding:26px 30px;margin-bottom:24px;box-shadow:var(--shadow)}
.snap::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(640px 300px at 50% -40%, rgba(61,220,132,.1), transparent 70%)}
.snap::after{content:'';position:absolute;left:24px;right:24px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--turf),var(--gold),transparent);opacity:.65}
.snap-comp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px;font-weight:700;margin-bottom:14px}
.snap-main{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.snap-team{flex:1;font-family:var(--display-c);font-stretch:82%;font-size:clamp(20px,3vw,30px);font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snap-team.away{text-align:right}
.snap-score{font-family:var(--display-c);font-stretch:70%;font-size:clamp(36px,4.6vw,50px);font-weight:700;color:#ffd9dd;
  min-width:170px;text-align:center;letter-spacing:3px;font-variant-numeric:tabular-nums;line-height:1;padding:10px 14px;
  border-radius:12px;background:linear-gradient(180deg,rgba(255,77,94,.17),rgba(255,77,94,.04) 60%,rgba(255,77,94,.015));
  border:1px solid rgba(255,77,94,.3);
  box-shadow:inset 0 0 22px rgba(255,77,94,.1),0 0 34px -10px rgba(255,77,94,.5);
  text-shadow:0 0 14px rgba(255,255,255,.3),0 0 30px var(--red-glow)}
.snap-score.zero{color:#8fa698;text-shadow:none;background:rgba(11,19,14,.7);border-color:var(--line2);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.5)}
.snap-meta{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap;align-items:center}
.snap-meta b{color:var(--text);font-weight:600}
.snap-odds{display:flex;gap:10px;flex-wrap:wrap}
.snap-odds .chip{padding:7px 12px;font-size:12px}

/* ---- events timeline ---- */
.tline{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--shadow)}
.tev{display:flex;gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;
  border-radius:8px;transition:background .12s}
.tev:last-child{border-bottom:none}
.tev:hover{background:rgba(61,220,132,.04)}
.tev-time{color:var(--faint);font-size:11px;font-family:var(--mono);min-width:76px}
.tev-min{background:var(--inset);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;font-size:11px;
  color:var(--orange);font-weight:700;min-width:46px;text-align:center;font-family:var(--mono)}
.tev-type{font-weight:700;min-width:100px;letter-spacing:.3px}
.tev-type.goal{color:var(--red)}
.tev-type.status{color:var(--purple)}
.tev-detail{color:var(--text);flex:1}

.notfound{text-align:center;padding:70px 20px}
.notfound h2{font-family:var(--display);font-size:24px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.notfound p{color:var(--muted);margin-bottom:22px}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="floodglow" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">⚽</span>
    <span class="brand-name">Foot<b>ball</b>&nbsp;Ops</span>
  </a>
  <a class="btn-sm" href="/" style="margin-left:6px">← Quay lại</a>
  <div class="topbar-spacer"></div>
  <div class="topbar-status" style="max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
    <span id="hdrTitle">Đang tải…</span>
  </div>
  <a class="btn-sm" id="analyzeBtn" href="#">🔍 Phân tích</a>
  <button class="btn-sm" onclick="goDisguise()">🔄 Đổi</button>
  <form method="post" action="/logout" style="margin:0">
    <button class="btn-sm danger" type="submit">Đăng xuất</button>
  </form>
</header>

<div class="main" id="main" style="max-width:1150px">
  <div class="empty">Đang tải dữ liệu trận đấu…</div>
</div>

<div class="toast" id="toast"></div>

<script>
const matchId = {{ match_id_json | safe }};

function fmt(utcStr){
  if(!utcStr) return '—';
  return new Date(utcStr).toLocaleString('vi-VN',{
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',
    timeZone:'Asia/Ho_Chi_Minh'
  });
}
function fmtTime(utcStr){
  if(!utcStr) return '—';
  return new Date(utcStr).toLocaleTimeString('vi-VN',{
    hour:'2-digit',minute:'2-digit',second:'2-digit',
    timeZone:'Asia/Ho_Chi_Minh'
  });
}
// In-half time: 1H:31, 2H:15 (m-45), HT, INJURY_TIME_H2 -> 2H:45+, FT
function fmtInHalf(r){
  if(!r) return '—';
  const s = (r.status||'').toUpperCase();
  const m = r.minute;
  if (s === 'FT') return 'FT';
  if (s === 'HT') return 'HT';
  if (s === 'INJURY_TIME_H1') return '1H:45+';
  if (s === 'INJURY_TIME_H2') return '2H:45+';
  if (s === 'H1') return '1H:' + (m != null ? m : '');
  if (s === 'H2') return '2H:' + (m != null ? Math.max(0, m - 45) : '');
  if (s === 'LIVE' && m != null) return (m <= 45 ? '1H:' + m : '2H:' + (m - 45));
  if (s === 'UPCOMING' || m == null) return '—';
  return s;
}
function badge(s){
  const live=['LIVE','H1','H2','INJURY_TIME_H1','INJURY_TIME_H2'];
  if(live.includes(s)) return '<span class="badge b-live">'+s+'</span>';
  if(s==='HT') return '<span class="badge b-ht">HT</span>';
  if(s==='UPCOMING') return '<span class="badge b-up">UPCOMING</span>';
  if(s==='FT') return '<span class="badge b-ft">FT</span>';
  return '<span class="badge b-x">'+s+'</span>';
}
function escHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},3500);
}

async function apiFetch(url){
  try{
    const r=await fetch(url);
    if(r.status===401){location.href='/login';return null;}
    if(r.status===404) return {__notfound:true};
    return r.ok?r.json():null;
  }catch(e){
    showToast('Loi ket noi: '+e.message);
    return null;
  }
}

function renderNotFound(){
  document.getElementById('hdrTitle').textContent='Không tìm thấy';
  document.getElementById('main').innerHTML =
    '<div class="notfound"><h2>Không tìm thấy trận đấu</h2>'+
    '<p>Trận đấu này có thể đã bị xóa hoặc ID không hợp lệ.</p>'+
    '<a class="btn" href="/">← Về dashboard</a></div>';
}

function renderSnapshot(m){
  document.getElementById('hdrTitle').textContent = m.home+' vs '+m.away;
  const min = m.status==='HT' ? 'HT' : (m.minute ? m.minute+"'" : '—');
  const ouChip = m.ou_line
    ? '<div class="chip"><span class="chip-label">OU</span><b>'+m.ou_line+'</b> O '+(m.over_odds||'?')+' / U '+(m.under_odds||'?')+'</div>'
    : '';
  const hcChip = m.home_handicap
    ? '<div class="chip"><span class="chip-label">HC</span>'+escHtml(m.home_handicap)+' @'+(m.home_handicap_odds||'?')+' / '+escHtml(m.away_handicap)+' @'+(m.away_handicap_odds||'?')+'</div>'
    : '';
  const x2Chip = m.odds_1
    ? '<div class="chip"><span class="chip-label">1X2</span><b>'+m.odds_1+'</b> / '+(m.odds_x||'?')+' / <b>'+m.odds_2+'</b></div>'
    : '';
  return ''+
    '<div class="snap reveal">'+
      '<div class="snap-comp">'+escHtml(m.competition)+'</div>'+
      '<div class="snap-main">'+
        '<div class="snap-team">'+escHtml(m.home)+'</div>'+
        '<div class="snap-score'+(m.home_score===0&&m.away_score===0?' zero':'')+'">'+m.home_score+' - '+m.away_score+'</div>'+
        '<div class="snap-team away">'+escHtml(m.away)+'</div>'+
      '</div>'+
      '<div class="snap-meta">'+
        '<span>Trạng thái: '+badge(m.status)+'</span>'+
        '<span>Phút: <b>'+min+'</b></span>'+
        '<span>Bắt đầu: <b>'+fmt(m.start_time_utc)+'</b></span>'+
      '</div>'+
      (ouChip||hcChip||x2Chip ? '<div class="snap-odds">'+ouChip+hcChip+x2Chip+'</div>' : '')+
    '</div>';
}

function fmtCell(v){return v==null?'—':v;}
function diff(curr,prev){
  if(curr==null||prev==null||curr===prev) return '';
  return curr>prev?' diff-up':' diff-down';
}

function renderOddsHistory(rows){
  const count = rows.length;
  let html = '<div class="sec reveal reveal-d1"><div class="sec-hdr">'+
    '<span class="sec-title">Biến động kèo</span>'+
    '<span class="sec-badge">'+count+'</span></div>';
  if(!count){
    html += '<div class="empty">Chưa ghi nhận biến động</div></div>';
    return html;
  }
  html += '<div class="twrap"><table><thead><tr>'+
    '<th>Thời gian (hiệp)</th>'+
    '<th>HC nhà</th><th>HC khách</th>'+
    '<th>OU</th><th>Over</th><th>Under</th>'+
    '<th>1</th><th>X</th><th>2</th>'+
    '</tr></thead><tbody>';
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    const p=i>0?rows[i-1]:null;
    html += '<tr>'+
      '<td style="color:var(--muted)">'+fmtInHalf(r)+'</td>'+
      '<td>'+escHtml(fmtCell(r.home_handicap))+' <span class="'+(p?diff(r.home_handicap_odds,p.home_handicap_odds):'').trim()+'">@'+fmtCell(r.home_handicap_odds)+'</span></td>'+
      '<td>'+escHtml(fmtCell(r.away_handicap))+' <span class="'+(p?diff(r.away_handicap_odds,p.away_handicap_odds):'').trim()+'">@'+fmtCell(r.away_handicap_odds)+'</span></td>'+
      '<td>'+escHtml(fmtCell(r.ou_line))+'</td>'+
      '<td class="'+(p?diff(r.over_odds,p.over_odds):'').trim()+'">'+fmtCell(r.over_odds)+'</td>'+
      '<td class="'+(p?diff(r.under_odds,p.under_odds):'').trim()+'">'+fmtCell(r.under_odds)+'</td>'+
      '<td class="'+(p?diff(r.odds_1,p.odds_1):'').trim()+'">'+fmtCell(r.odds_1)+'</td>'+
      '<td class="'+(p?diff(r.odds_x,p.odds_x):'').trim()+'">'+fmtCell(r.odds_x)+'</td>'+
      '<td class="'+(p?diff(r.odds_2,p.odds_2):'').trim()+'">'+fmtCell(r.odds_2)+'</td>'+
      '</tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

function renderEvents(rows){
  const count=rows.length;
  let html = '<div class="sec reveal reveal-d2"><div class="sec-hdr">'+
    '<span class="sec-title">Diễn biến trận</span>'+
    '<span class="sec-badge">'+count+'</span></div>';
  if(!count){
    html += '<div class="empty">Chưa ghi nhận sự kiện</div></div>';
    return html;
  }
  html += '<div class="tline">';
  for(const e of rows){
    const typeCls = e.event_type==='GOAL'?'goal':(e.event_type==='STATUS_CHANGE'?'status':'');
    const typeLabel = e.event_type==='GOAL'?'⚽ Bàn thắng':(e.event_type==='STATUS_CHANGE'?'🔁 Trạng thái':e.event_type);
    const min = e.minute ? e.minute+"'" : '—';
    html += '<div class="tev">'+
      '<span class="tev-time">'+fmtTime(e.occurred_at)+'</span>'+
      '<span class="tev-min">'+min+'</span>'+
      '<span class="tev-type '+typeCls+'">'+typeLabel+'</span>'+
      '<span class="tev-detail">'+escHtml(e.detail||'')+' &nbsp;<span style="color:var(--muted)">('+(e.home_score!=null?e.home_score:'?')+'-'+(e.away_score!=null?e.away_score:'?')+')</span></span>'+
      '</div>';
  }
  html += '</div></div>';
  return html;
}

async function load(){
  if (document.hidden) return;  // v44: skip when tab hidden
  const [m, odds, events] = await Promise.all([
    apiFetch('/api/matches/'+encodeURIComponent(matchId)),
    apiFetch('/api/matches/'+encodeURIComponent(matchId)+'/odds-history'),
    apiFetch('/api/matches/'+encodeURIComponent(matchId)+'/events'),
  ]);
  if(!m||m.__notfound){renderNotFound();return;}
  document.getElementById('analyzeBtn').href = '/analyzer?match_id=' + encodeURIComponent(matchId);
  document.getElementById('main').innerHTML =
    renderSnapshot(m) +
    renderOddsHistory(odds||[]) +
    renderEvents(events||[]);
}

load();
setInterval(load, 12000);
</script>
{% include '_lock_overlay.html' %}
<script src="/static/lock.js"></script>
</body>
</html>
