version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: football_db
    restart: always
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: football_dashboard
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://football:***@db:5432/football
    depends_on:
      db:
        condition: service_healthy
    # Web container reuses the Dockerfile-level HEALTHCHECK (db_ping) — that
    # already proves both uvicorn imports and the DB pool resolve. We override
    # with an HTTP probe instead so a half-deadlocked event loop is also caught.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  collector:
    build: .
    container_name: football_collector
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://football:***@db:5432/football
    depends_on:
      db:
        condition: service_healthy
    # Heartbeat-based: collector writes `last_heartbeat` to collector_state
    # every loop iteration. Threshold defaults to 3 × POLL_INTERVAL.
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_collector.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    command: python run_collector.py

volumes:
  pgdata:
