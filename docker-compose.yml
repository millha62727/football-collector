version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: football_db
    restart: always
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: football_dashboard
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  collector:
    build: .
    container_name: football_collector
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_collector.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    command: python run_collector.py

  vector:
    build: ./vector
    container_name: football_vector
    restart: always
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      DB_HOST: db
      DB_NAME: football
      DB_USER: football
      DB_PASS: football
    volumes:
      - vector_logs:/app/flow_log
      - vector_events:/app/flow_events

volumes:
  pgdata:
  vector_logs:
  vector_events:
